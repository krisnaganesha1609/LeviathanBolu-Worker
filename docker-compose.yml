version: "3.9"

services:
  stt:
    build:
      context: .
      dockerfile: docker/stt.Dockerfile
      args:
        STT_FULL: ${STT_FULL:-0}
    container_name: leviathan-stt
    env_file:
      - .env
    environment:
      STT_ENGINE: ${STT_ENGINE:-dummy}
    ports:
      - "9001:9001"
    volumes:
      - stt-model-cache:/home/leviathan/.cache
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:9001/health" ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  tts:
    build:
      context: .
      dockerfile: docker/tts.Dockerfile
      args:
        TTS_FULL: ${TTS_FULL:-0}
    container_name: leviathan-tts
    env_file:
      - .env
    environment:
      TTS_ENGINE: ${TTS_ENGINE:-dummy}
    ports:
      - "9002:9002"
    volumes:
      - ./models:/models:ro # mount kokoro-v1.0.onnx + voices-v1.0.bin here for TTS_ENGINE=kokoro
      - tts-model-cache:/home/leviathan/.cache
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:9002/health" ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  stt-model-cache:
  tts-model-cache:
