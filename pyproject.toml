[project]
name = "leviathan-workers"
version = "1.0.0"
description = "LEVIATHAN — STT (faster-whisper + Silero VAD) & TTS (Kokoro) asyncio worker microservices"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }

# ── Core (always installed) ────────────────────────────────────────────────
# Enough to run both servers end-to-end in DUMMY engine mode (no ML weights
# required). This is what CI / unit tests / docker build use by default.
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "websockets>=12.0,<13.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "structlog>=24.1,<25.0",
    "python-dotenv>=1.0,<2.0",
    "numpy>=1.26,<2.0",
    "orjson>=3.10,<4.0",
    "httpx>=0.27,<1.0",
    "anyio>=4.4,<5.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# faster-whisper (CTranslate2) real STT inference stack — no torch needed.
stt-full = [
    "faster-whisper>=1.0,<2.0",
    "onnxruntime>=1.18,<2.0",
]
# Real Kokoro TTS inference stack.
tts-full = [
    "kokoro-onnx>=0.5.0",
    "soundfile>=0.12",
    "scipy>=1.13",
]
# Optional higher quality pitch-shifting for TTS personalities.
tts-pitch = [
    "librosa>=0.10",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.uv]
# `uv sync --extra stt-full --extra tts-full --extra dev` for a full install.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "stt", "tts"]
